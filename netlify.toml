[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API de réservation et de connexion
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Anciennes adresses : elles mènent à la nouvelle application
[[redirects]]
  from = "https://ocd.pelify.app/*"
  to = "https://pelify.app/arena/jouer/"
  status = 301
  force = true

[[redirects]]
  from = "/arena/reserver/*"
  to = "/arena/jouer/"
  status = 301
  force = true

# Application Arena (page unique)
[[redirects]]
  from = "/arena/jouer/*"
  to = "/arena/jouer/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
